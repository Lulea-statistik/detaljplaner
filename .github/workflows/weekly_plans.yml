name: Veckovis detaljplanekontroll
on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/collect.py
      - name: Publicera uppdaterad data med webbsidan
        run: |
          mkdir -p docs/data/changes
          cp data/latest.json docs/data/latest.json
          cp data/status_history.json docs/data/status_history.json
          cp data/description_history.json docs/data/description_history.json
          cp data/history_index.json docs/data/history_index.json
          cp data/changes/*.json docs/data/changes/
      - name: Ladda upp felsökningsunderlag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planlista-diagnostik
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Spara inventering och historik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera detaljplaneinventering"
            git push
          fi
